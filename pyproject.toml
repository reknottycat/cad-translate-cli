[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-translate-cli"
version = "1.0.0"
description = "CAD图纸翻译CLI工具 - DWG/DXF文字提取、LLM翻译、回填"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
cad-translate = "cli.cad_cli:main"
